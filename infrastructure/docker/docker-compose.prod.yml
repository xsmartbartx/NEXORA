        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_NEXORA_ENV: production
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  cspm:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: cspm
        APP_PORT: "3008"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_NEXORA_ENV: production
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: gateway
        APP_PORT: "3009"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_NEXORA_ENV: production
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
    depends_on:
