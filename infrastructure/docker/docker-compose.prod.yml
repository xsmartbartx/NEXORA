# Production topology for a single VM (e.g. one OCI instance): the 10 apps
# plus Postgres. No port is published to the host — TLS and routing live
# in infrastructure/edge/, a separate Caddy stack shared with the other
# projects on the same host, which joins this project's network and
# proxies each onenexora.com subdomain to its container. See README.md's
# "Going to production" section before running this for the first time.
#
# One secrets file, not one per app: infrastructure/docker/.env.prod
# (copy from .env.prod.example, never committed — see .gitignore). A
# single VM is easier to operate with one file to edit than ten.
#
# Run from the repository root:
#   docker compose -f infrastructure/docker/docker-compose.prod.yml \
#     --env-file infrastructure/docker/.env.prod up -d --build

# Pinned, not left to default to the directory name: infrastructure/edge/
# addresses this stack by its network (nexora_default) and container names
# (nexora-<service>-1).
name: nexora

# Secrets: .env.prod is read only for ${VAR} interpolation (--env-file),
# never loaded wholesale into a container. Each service lists exactly the
# secrets its code reads — Stripe's secret key reaches only console
# (checkout), the webhook secret only api, the upstream AI key only
# gateway. Add a secret to a service only when its code needs it.
# Per-product, per-tier Stripe price ids (packages/billing/src/plans.ts) —
# an anchor instead of duplicating all 24 across both services that need
# them: `console` (checkout) and `api` (the webhook matches an incoming
# price id back to a plan tier).
x-stripe-product-prices: &stripe-product-prices
  STRIPE_PRICE_ID_SENTINEL_STARTER: ${STRIPE_PRICE_ID_SENTINEL_STARTER}
  STRIPE_PRICE_ID_SENTINEL_STARTER_YEARLY: ${STRIPE_PRICE_ID_SENTINEL_STARTER_YEARLY}
  STRIPE_PRICE_ID_SENTINEL_PRO: ${STRIPE_PRICE_ID_SENTINEL_PRO}
  STRIPE_PRICE_ID_SENTINEL_PRO_YEARLY: ${STRIPE_PRICE_ID_SENTINEL_PRO_YEARLY}
  STRIPE_PRICE_ID_SENTINEL_BUSINESS: ${STRIPE_PRICE_ID_SENTINEL_BUSINESS}
  STRIPE_PRICE_ID_SENTINEL_BUSINESS_YEARLY: ${STRIPE_PRICE_ID_SENTINEL_BUSINESS_YEARLY}
  STRIPE_PRICE_ID_SENTINEL_SCALE: ${STRIPE_PRICE_ID_SENTINEL_SCALE}
  STRIPE_PRICE_ID_SENTINEL_SCALE_YEARLY: ${STRIPE_PRICE_ID_SENTINEL_SCALE_YEARLY}
  STRIPE_PRICE_ID_CSPM_STARTER: ${STRIPE_PRICE_ID_CSPM_STARTER}
  STRIPE_PRICE_ID_CSPM_STARTER_YEARLY: ${STRIPE_PRICE_ID_CSPM_STARTER_YEARLY}
  STRIPE_PRICE_ID_CSPM_PRO: ${STRIPE_PRICE_ID_CSPM_PRO}
  STRIPE_PRICE_ID_CSPM_PRO_YEARLY: ${STRIPE_PRICE_ID_CSPM_PRO_YEARLY}
  STRIPE_PRICE_ID_CSPM_BUSINESS: ${STRIPE_PRICE_ID_CSPM_BUSINESS}
  STRIPE_PRICE_ID_CSPM_BUSINESS_YEARLY: ${STRIPE_PRICE_ID_CSPM_BUSINESS_YEARLY}
  STRIPE_PRICE_ID_CSPM_SCALE: ${STRIPE_PRICE_ID_CSPM_SCALE}
  STRIPE_PRICE_ID_CSPM_SCALE_YEARLY: ${STRIPE_PRICE_ID_CSPM_SCALE_YEARLY}
  STRIPE_PRICE_ID_GATEWAY_STARTER: ${STRIPE_PRICE_ID_GATEWAY_STARTER}
  STRIPE_PRICE_ID_GATEWAY_STARTER_YEARLY: ${STRIPE_PRICE_ID_GATEWAY_STARTER_YEARLY}
  STRIPE_PRICE_ID_GATEWAY_PRO: ${STRIPE_PRICE_ID_GATEWAY_PRO}
  STRIPE_PRICE_ID_GATEWAY_PRO_YEARLY: ${STRIPE_PRICE_ID_GATEWAY_PRO_YEARLY}
  STRIPE_PRICE_ID_GATEWAY_BUSINESS: ${STRIPE_PRICE_ID_GATEWAY_BUSINESS}
  STRIPE_PRICE_ID_GATEWAY_BUSINESS_YEARLY: ${STRIPE_PRICE_ID_GATEWAY_BUSINESS_YEARLY}
  STRIPE_PRICE_ID_GATEWAY_SCALE: ${STRIPE_PRICE_ID_GATEWAY_SCALE}
  STRIPE_PRICE_ID_GATEWAY_SCALE_YEARLY: ${STRIPE_PRICE_ID_GATEWAY_SCALE_YEARLY}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nexora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Shared distributed rate-limit counter for apps/api and apps/gateway
  # (packages/api-kit/src/rate-limit.ts) — one bucket per API key across
  # every replica, instead of each replica counting its own. No password:
  # not published to the host, reachable only from this compose network.
  redis:
    image: redis:7-alpine
    # Counters only (every key has a TTL): no persistence, and a hard memory
    # cap on the shared host that evicts the soonest-expiring keys first.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "volatile-ttl",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Metrics stack (infrastructure/docker/README.md's "Monitoring" section):
  # one exporter per thing being watched, Prometheus scraping all three
  # (infrastructure/docker/monitoring/prometheus.yml), Grafana for
  # dashboards. None of these publish a host port — reached only through
  # the edge Caddy stack's monitoring.onenexora.com, same pattern every
  # app here already follows.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # Host-level metrics (CPU, disk, load) — needs the host's PID namespace
  # and read-only access to /proc, /sys and / to report on the VM itself,
  # not just this container; standard node_exporter deployment pattern.
  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(host/)?(sys|proc|dev|rootfs/var/lib/docker/.+)($$|/)"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nexora-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Grafana's default anonymous-org-creation/signup flows are for a
      # multi-tenant SaaS deployment, not a single-operator dashboard —
      # off, so the admin login above is the only way in.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - nexora-grafana-data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  db-migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora

  website:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: website
        APP_PORT: "3000"
        NEXT_PUBLIC_SITE_URL: https://onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_DEVELOPERS_URL: https://developers.onenexora.com
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production

  account:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: account
        APP_PORT: "3001"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_ACCOUNT_URL: https://account.onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_API_URL: https://api.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_DEVELOPERS_URL: https://developers.onenexora.com
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}

  console:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: console
        APP_PORT: "3002"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_ACCOUNT_URL: https://account.onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_API_URL: https://api.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_DEVELOPERS_URL: https://developers.onenexora.com
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production
    environment:
      <<: *stripe-product-prices
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}
      STRIPE_COUPON_BUNDLE_2: ${STRIPE_COUPON_BUNDLE_2:-}
      STRIPE_COUPON_BUNDLE_3: ${STRIPE_COUPON_BUNDLE_3:-}
      NEXORA_ADMIN_EMAILS: ${NEXORA_ADMIN_EMAILS}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  status:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: status
        APP_PORT: "3003"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_ACCOUNT_URL: https://account.onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production
    # The host's nightly backup script (/opt/backups/backup-all.sh) writes
    # its last-success timestamp here; /api/backup reports its freshness.
    volumes:
      - /opt/backups/heartbeat:/backup-heartbeat:ro

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: api
        APP_PORT: "3004"
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production
    environment:
      <<: *stripe-product-prices
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Clerk's organization.deleted webhook (/v1/webhooks/clerk) cancels the
      # org's Stripe subscription before purging its data, so api needs both.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
      REDIS_URL: redis://redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  docs:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: docs
        APP_PORT: "3005"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_API_URL: https://api.onenexora.com
        NEXT_PUBLIC_SENTINEL_URL: https://sentinel.onenexora.com
        NEXT_PUBLIC_CSPM_URL: https://cspm.onenexora.com
        NEXT_PUBLIC_GATEWAY_URL: https://gateway.onenexora.com
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production

  developers:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: developers
        APP_PORT: "3006"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_API_URL: https://api.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production

  sentinel:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: sentinel
        APP_PORT: "3007"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  cspm:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: cspm
        APP_PORT: "3008"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: gateway
        APP_PORT: "3009"
        NEXT_PUBLIC_WEBSITE_URL: https://onenexora.com
        NEXT_PUBLIC_CONSOLE_URL: https://console.onenexora.com
        NEXT_PUBLIC_STATUS_URL: https://status.onenexora.com
        NEXT_PUBLIC_DOCS_URL: https://docs.onenexora.com
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_NEXORA_ENV: production
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      GATEWAY_UPSTREAM_API_KEY: ${GATEWAY_UPSTREAM_API_KEY}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
      REDIS_URL: redis://redis:6379
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  nexora-postgres-data:
  nexora-prometheus-data:
  nexora-grafana-data:
