# Version updates. Security updates are enabled separately in the repository settings.
# Minor and patch bumps are grouped so a quiet week is one PR, not twenty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types must match the Node the apps run on: 22, in
      # infrastructure/docker/Dockerfile and CI. Raise this with the runtime.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      # typescript-eslint does not support TypeScript 7 yet, so lint fails
      # (closed PR #113). Remove once it does.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: monthly
