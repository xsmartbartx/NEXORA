name: Temporary Growth formatting repair

on:
  push:
    branches:
      - feat/growth-strategy-intelligence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply repository Prettier configuration
        run: |
          npx prettier --write \
            "apps/console/src/app/growth/**/*.{ts,tsx}" \
            packages/database/src/schema.ts \
            packages/database/src/index.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/console/src/app/growth packages/database/src/schema.ts packages/database/src/index.ts
            git commit -m "style(growth): apply repository Prettier formatting"
            git push
          fi
