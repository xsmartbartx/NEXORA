name: CostSec

# Weekly, read-only audit of the repository's own configuration (branch protection, secret
# scanning, workflow permissions, open high alerts). The result is one issue that is updated
# in place and closed when clean; GitHub notifies the owner. See ops/costsec/README.md.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: costsec
  cancel-in-progress: false

jobs:
  audit:
    name: Configuration audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs (tags are mutable) and run from main, so a manual run from
      # another branch cannot judge that branch's workflow files. No credentials are kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run the audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional fine-grained read-only token; without it protection and security
          # settings are reported as UNVERIFIED.
          COSTSEC_TOKEN: ${{ secrets.COSTSEC_TOKEN }}
        run: node ops/costsec/run.mjs
