name: Temporary Growth documentation formatting repair

on:
  push:
    branches:
      - feat/growth-strategy-intelligence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format strategy documentation
        run: npx prettier --write docs/growth/strategy-intelligence.md
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add docs/growth/strategy-intelligence.md
            git commit -m "style(growth): format strategy intelligence documentation"
            git push
          fi
