name: Format G6 schema artifact

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/database/src/schema.ts"
      - ".github/workflows/format-g6-artifact.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.12.1
      - run: npm ci
      - name: Format schema
        run: npx prettier --write packages/database/src/schema.ts
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-g6-schema
          path: packages/database/src/schema.ts
          if-no-files-found: error
          retention-days: 1
