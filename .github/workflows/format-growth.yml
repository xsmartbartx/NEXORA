name: Format Growth Engine branch

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/console/src/app/growth/**"
      - "packages/database/src/schema.ts"
      - "docs/adr/ADR-0014-growth-engine-boundary.md"
      - "docs/growth/marketing-engine.md"
      - ".github/workflows/format-growth.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Growth Engine files
        run: |
          npx prettier --write \
            apps/console/src/app/growth/actions.ts \
            apps/console/src/app/growth/approvals/page.tsx \
            apps/console/src/app/growth/campaigns/page.tsx \
            apps/console/src/app/growth/content/page.tsx \
            apps/console/src/app/growth/page.tsx \
            docs/adr/ADR-0014-growth-engine-boundary.md \
            docs/growth/marketing-engine.md \
            packages/database/src/schema.ts

      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/console/src/app/growth docs/adr/ADR-0014-growth-engine-boundary.md docs/growth/marketing-engine.md packages/database/src/schema.ts
          git commit -m "style(growth): apply Prettier formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify formatting and Console build
        run: |
          npm run format:check
          npm run lint --workspace apps/console
          npm run typecheck --workspace apps/console
          npm run build --workspace apps/console
